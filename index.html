<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Payment Gateway</title>
    <style>
        body { font-family: Arial; background:#f4f6f8; padding:40px; }
        .box { max-width:450px; margin:auto; background:white; padding:25px;
               border-radius:10px; box-shadow:0 2px 10px #ccc; }
        input, select, button { width:100%; padding:10px; margin:8px 0 15px;
                                 box-sizing:border-box; }
        button { cursor:pointer; }
        #result { font-weight:bold; }
    </style>
</head>
<body>
<div class="box">
    <h2>Online Payment Gateway</h2>

    <form id="paymentForm">
        <label>Sender</label>
        <input type="text" id="sender" required>

        <label>Receiver</label>
        <input type="text" id="receiver" required>

        <label>Amount</label>
        <input type="number" id="amount" min="1" required>

        <label>Currency</label>
        <select id="currency">
            <option value="INR">INR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
        </select>

        <label>Card Number</label>
        <input type="password" id="cardNumber" maxlength="16" required>

        <label>PIN</label>
        <input type="password" id="pin" maxlength="4" required>

        <button type="submit">Pay Now</button>
    </form>

    <p id="result"></p>
</div>

<script src="script.js"></script>
</body>
</html>
